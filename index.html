<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --primary:#1C2A38;
    --primary-dark:#121B24;
    --accent:#FF6B1A;
    --accent-dark:#E25A0C;
    --text:#1C2A38;
    --muted:#5B6B7A;
    --success:#2E8B57;
    --danger:#C0392B;
    --border:#DCE2E8;
    --grad-primary: linear-gradient(135deg, #24374A 0%, var(--primary) 55%, var(--primary-dark) 100%);
    --grad-accent: linear-gradient(135deg, #FF8A3D 0%, var(--accent) 55%, var(--accent-dark) 100%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:linear-gradient(180deg, #F2F4F7 0%, var(--bg) 220px);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* حركة دخول ناعمة لكل شاشة جديدة */
  #screenHost > div{
    animation: screenFadeIn .38s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes screenFadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* شريط الباركود العلوي - يعكس طبيعة النظام */
  .barcode-band{
    background:var(--grad-primary);
    padding:40px 20px 32px;
    position:relative;
    overflow:hidden;
  }
  .barcode-band::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.09) 0px,
      rgba(255,255,255,0.09) 2px,
      transparent 2px,
      transparent 6px,
      rgba(255,255,255,0.14) 6px,
      rgba(255,255,255,0.14) 7px,
      transparent 7px,
      transparent 14px,
      rgba(255,255,255,0.09) 14px,
      rgba(255,255,255,0.09) 17px,
      transparent 17px,
      transparent 22px
    );
    opacity:0.5;
  }
  .brand{
    position:relative;
    text-align:center;
  }
  .brand-mark{
    display:inline-flex;
    align-items:center;
    gap:12px;
    color:#fff;
  }
  .brand-mark img{
    width:52px;height:52px;border-radius:14px;flex-shrink:0;
    box-shadow:0 6px 20px rgba(0,0,0,0.35), 0 0 0 3px rgba(255,255,255,0.15);
  }
  .brand-mark svg{width:30px;height:30px;flex-shrink:0;}
  .brand-title{
    font-weight:900;
    font-size:23px;
    letter-spacing:0.5px;
    color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .brand-sub{
    margin-top:9px;
    color:#C7D0D8;
    font-size:13.5px;
    font-weight:500;
    position:relative;
  }

  .content{
    flex:1;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:22px 16px 40px;
    margin-top:-18px;
    position:relative;
  }

  .card{
    background:var(--surface);
    width:100%;
    max-width:400px;
    border-radius:18px;
    box-shadow:0 16px 40px rgba(18,27,36,0.16);
    padding:24px 20px 26px;
  }

  .tabs{
    display:flex;
    background:var(--bg);
    border-radius:10px;
    padding:4px;
    margin-bottom:20px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 8px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    color:var(--muted);
    border-radius:8px;
    cursor:pointer;
    transition:all .18s ease;
  }
  .tab-btn.active{
    background:var(--surface);
    color:var(--primary);
    box-shadow:0 3px 10px rgba(28,42,56,0.14);
  }

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--primary);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:9px;
    font-family:inherit;
    font-size:15px;
    color:var(--text);
    background:#FAFBFC;
    transition:border-color .15s ease;
  }
  .field input:focus{
    outline:none;
    border-color:var(--accent);
    background:#fff;
    box-shadow:0 0 0 3px rgba(255,107,26,0.14);
  }

  .hint{
    font-size:12px;
    color:var(--muted);
    margin-top:-6px;
    margin-bottom:16px;
    line-height:1.6;
  }

  .btn-primary{
    width:100%;
    background:var(--grad-accent);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:10px;
    font-family:inherit;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    transition:box-shadow .2s ease, transform .12s ease, filter .15s ease;
    margin-top:4px;
    box-shadow:0 6px 16px rgba(255,107,26,0.28);
  }
  .btn-primary:active{transform:scale(0.97);box-shadow:0 3px 8px rgba(255,107,26,0.25);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{background:#C8CFD6;cursor:not-allowed;box-shadow:none;}

  .msg{
    font-size:13.5px;
    font-weight:600;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:14px;
    display:none;
    line-height:1.6;
  }
  .msg.show{display:block;}
  .msg.error{background:#FBEAE8;color:var(--danger);}
  .msg.success{background:#E9F5EE;color:var(--success);}

  .panel{display:none;}
  .panel.active{display:block;}

  .footnote{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:18px;
    line-height:1.7;
  }

  /* شاشة ما بعد الدخول (مؤقتة لحد ما تُبنى الشاشات القادمة) */
  #appScreen{display:none;}
  #appScreen.active{display:flex;}
  .app-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .status-chip{
    display:inline-block;
    background:var(--primary);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .app-wrap h2{
    font-size:19px;
    margin:0 0 8px;
    color:var(--primary);
  }
  .app-wrap p{
    color:var(--muted);
    font-size:14px;
    max-width:320px;
    line-height:1.8;
    margin:0 0 20px;
  }
  .btn-outline{
    background:transparent;
    border:1.5px solid var(--border);
    color:var(--muted);
    padding:10px 20px;
    border-radius:9px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }

  .spinner{
    width:16px;height:16px;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:#fff;
    border-radius:50%;
    display:inline-block;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-left:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== لوحة المدير + شاشة إضافة منتج ===== */
  .topbar{
    background:var(--grad-primary);
    color:#fff;
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 4px 16px rgba(18,27,36,0.18);
  }
  .topbar-title{font-size:16px;font-weight:700;}
  .topbar-sub{font-size:12px;color:#C7D0D8;margin-top:2px;}
  .icon-btn{
    background:rgba(255,255,255,0.12);
    border:none;
    color:#fff;
    width:36px;height:36px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .icon-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.22);}
  .icon-btn svg{width:18px;height:18px;}

  .home-wrap{padding:18px 16px 40px;max-width:480px;margin:0 auto;}
  .action-card{
    background:var(--surface);
    border-radius:16px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 4px 14px rgba(28,42,56,0.07);
    cursor:pointer;
    margin-bottom:14px;
    border:1.5px solid transparent;
    transition:border-color .15s ease, box-shadow .2s ease, transform .12s ease;
  }
  .action-card:active{border-color:var(--accent);transform:scale(0.985);}
  .action-card:hover{box-shadow:0 8px 22px rgba(28,42,56,0.12);}
  .action-icon{
    width:48px;height:48px;
    border-radius:13px;
    background:linear-gradient(135deg, #FFF1E7 0%, #FFDFC2 100%);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:inset 0 0 0 1px rgba(255,107,26,0.12);
  }
  .action-icon svg{width:22px;height:22px;color:var(--accent);stroke:var(--accent);}
  .action-text h3{margin:0 0 3px;font-size:15px;color:var(--primary);font-weight:700;}
  .action-text p{margin:0;font-size:12.5px;color:var(--muted);}

  .form-screen{padding:18px 16px 50px;max-width:480px;margin:0 auto;}
  .section-label{
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    margin:20px 0 10px;
  }
  .section-label:first-child{margin-top:4px;}

  .dept-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .dept-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:9px;
    padding:10px 10px;
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
    user-select:none;
  }
  .dept-chip.picked{
    border-color:var(--accent);
    background:#FFF6EF;
    color:var(--accent-dark);
  }
  .dept-chip .order-num{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--border);
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .dept-chip.picked .order-num{
    background:var(--accent);
    color:#fff;
  }

  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .success-wrap{
    text-align:center;
    padding:30px 20px 40px;
  }
  .success-badge{
    width:64px;height:64px;
    border-radius:50%;
    background:linear-gradient(135deg,#E9F5EE,#CFEEDA);
    color:var(--success);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
    box-shadow:0 8px 20px rgba(46,139,87,0.18);
    animation: popIn .4s cubic-bezier(.3,1.4,.4,1);
  }
  @keyframes popIn{ from{ transform:scale(.5); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .success-badge svg{width:30px;height:30px;}
  #qrCanvas, #qrCanvasEdit{
    background:#fff;
    padding:14px;
    border-radius:14px;
    box-shadow:0 10px 28px rgba(28,42,56,0.14);
    display:inline-block;
    margin:16px 0;
  }
  .barcode-text{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:1px;
    color:var(--primary);
    background:var(--bg);
    padding:8px 14px;
    border-radius:8px;
    display:inline-block;
    margin-bottom:6px;
  }
  .security-note{
    background:#FFF6EF;
    color:var(--accent-dark);
    font-size:12px;
    line-height:1.8;
    padding:10px 14px;
    border-radius:9px;
    text-align:right;
    margin-top:16px;
  }

  /* ===== شاشة الكاميرا لقراءة الباركود ===== */
  .camera-overlay{
    position:fixed;
    inset:0;
    background:#000;
    z-index:999;
    display:none;
    flex-direction:column;
  }
  .camera-overlay.active{display:flex;}
  .camera-video-wrap{
    position:relative;
    flex:1;
    overflow:hidden;
  }
  .camera-video-wrap video{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .camera-frame{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:70%;
    aspect-ratio:1;
    border:3px solid var(--accent);
    border-radius:16px;
    box-shadow:0 0 0 2000px rgba(0,0,0,0.45);
  }
  .camera-topbar{
    position:absolute;
    top:0;left:0;right:0;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:2;
  }
  .camera-title{
    color:#fff;
    font-weight:700;
    font-size:14px;
    background:rgba(0,0,0,0.4);
    padding:8px 14px;
    border-radius:20px;
  }
  .camera-close{
    background:rgba(255,255,255,0.15);
    border:none;
    color:#fff;
    width:38px;height:38px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .camera-hint{
    text-align:center;
    color:#fff;
    font-size:13px;
    padding:16px;
    background:#000;
  }
  .camera-manual-link{
    text-align:center;
    padding:0 16px 20px;
    background:#000;
  }
  .camera-manual-link button{
    background:transparent;
    border:none;
    color:var(--accent);
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
  }

  /* طباعة الباركود فقط بدون أي عنصر آخر بالصفحة */
  #reportPrintArea{ display:none; }

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *, #reportPrintArea, #reportPrintArea *{visibility:visible;}
    #reportPrintArea{ display:block; }
    #printArea{
      position:absolute;
      top:0;left:0;
      width:100%;
      text-align:center;
      padding-top:30px;
    }
    #printArea svg{
      width:260px !important;
      height:260px !important;
    }
    #printArea .barcode-text{
      font-size:22px !important;
      margin-bottom:14px !important;
    }
    #reportPrintArea{
      position:absolute;
      top:0;left:0;
      width:100%;
      padding:24px;
      direction:rtl;
      font-family:'Tajawal',sans-serif;
      color:#1C2A38;
    }
    #reportPrintArea table{
      width:100%;
      border-collapse:collapse;
      font-size:12px;
      margin-top:10px;
    }
    #reportPrintArea th, #reportPrintArea td{
      border:1px solid #999;
      padding:6px 8px;
      text-align:right;
    }
    #reportPrintArea th{
      background:#1C2A38 !important;
      color:#fff !important;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    #reportPrintArea tr:nth-child(even) td{
      background:#F4F6F8 !important;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
  }
</style>
</head>

<script>
  const SUPABASE_URL = "https://zlwovezrbugpvrhudcgy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ilGcV6rd4WS-XFj8uansmg_fC6WUUMM";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function showMsg(text, type){
    const el = document.getElementById('authMsg');
    el.textContent = text;
    el.className = 'msg show ' + type;
  }
  function hideMsg(){
    const el = document.getElementById('authMsg');
    el.className = 'msg';
  }

  function setLoading(btn, loading, originalText){
    btn.disabled = loading;
    btn.innerHTML = loading ? originalText + '<span class="spinner"></span>' : originalText;
  }

  async function doLogin(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if(!email || !password){ showMsg('الرجاء تعبئة البريد وكلمة المرور', 'error'); return; }

    const btn = document.getElementById('loginBtn');
    setLoading(btn, true, 'دخول');
    hideMsg();

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if(error){
      setLoading(btn, false, 'دخول');
      showMsg('بيانات الدخول غير صحيحة، تحقق من البريد وكلمة المرور', 'error');
      return;
    }
    await loadProfileAndEnter();
    setLoading(btn, false, 'دخول');
  }

  async function loadProfileAndEnter(){
    const { data: { user } } = await sb.auth.getUser();
    if(!user) return;

    const { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single();

    if(error || !profile){
      showMsg('تم تسجيل الدخول لكن لا يوجد ملف صلاحيات مرتبط بهذا الحساب. تواصل مع المدير.', 'error');
      await sb.auth.signOut();
      return;
    }

    currentProfile = profile;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appScreen').classList.add('active');
    document.getElementById('topbarSub').textContent = (profile.full_name || '') + ' · ' + (profile.role === 'admin' ? 'مدير' : 'مسؤول قسم');

    await fetchDepartments();
    refreshNotifBadge();

    if(profile.role === 'admin'){
      await goHome('renderAdminHome');
    } else {
      await goHome('renderDeptStation');
    }
  }

  async function doLogout(){
    await sb.auth.signOut();
    document.getElementById('appScreen').classList.remove('active');
    document.getElementById('authScreen').style.display = 'block';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
    showLoginPanelInstead();
    currentProfile = null;
  }

  // ============ البصمة/الوجه (WebAuthn محلي على الجهاز) ============
  const WEBAUTHN_KEY = 'bt_webauthn_cred';

  function bufToB64(buf){
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }
  function b64ToBuf(str){
    return Uint8Array.from(atob(str), c => c.charCodeAt(0));
  }
  function getSavedBiometric(){
    try { return JSON.parse(localStorage.getItem(WEBAUTHN_KEY) || 'null'); }
    catch(e){ return null; }
  }

  function showLoginPanelInstead(){
    document.getElementById('biometricPanel').classList.remove('active');
    document.getElementById('loginPanel').classList.add('active');
  }
  function showBiometricPanel(){
    document.getElementById('loginPanel').classList.remove('active');
    document.getElementById('biometricPanel').classList.add('active');
  }

  async function tryRegisterBiometric(){
    if(!window.PublicKeyCredential){
      alert('هذا المتصفح أو الجهاز لا يدعم البصمة/الوجه، جرّب من متصفح Safari الحديث');
      return;
    }
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const cred = await navigator.credentials.create({ publicKey: {
        challenge,
        rp: { name: 'BRAND AID' },
        user: {
          id: new TextEncoder().encode(currentProfile.id),
          name: currentProfile.full_name || 'user',
          displayName: currentProfile.full_name || 'user'
        },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000,
        attestation: 'none'
      }});
      if(cred){
        localStorage.setItem(WEBAUTHN_KEY, JSON.stringify({ uid: currentProfile.id, credId: bufToB64(cred.rawId) }));
        alert('تم تفعيل الدخول بالبصمة/الوجه لهذا الجهاز ✓');
        if(currentProfile.role === 'admin') renderAdminHome(); else renderDeptStation();

  }

  async function tryBiometricUnlock(){
    const saved = getSavedBiometric();
    if(!saved){ showLoginPanelInstead(); return; }
    const btn = document.getElementById('biometricBtn');
    setLoading(btn, true, '🔓 فتح ببصمتك');
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const assertion = await navigator.credentials.get({ publicKey: {
        challenge,
        allowCredentials: [{ id: b64ToBuf(saved.credId), type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000
      }});
      setLoading(btn, false, '🔓 فتح ببصمتك');
      if(assertion){
        await loadProfileAndEnter();
      } else {
        showMsg('تعذّر التحقق من البصمة', 'error');
      }
    } catch(e){
      setLoading(btn, false, '🔓 فتح ببصمتك');
      showMsg('تعذّر التحقق من البصمة، جرّب البريد وكلمة المرور', 'error');
    }
  }

  async function renderDepartmentReport(deptId, period){
    period = period || 'day';
    const dept = allDepartments.find(d => d.id === deptId);
    setTopbar('تقرير: ' + (dept ? dept.name : ''));

    const now = new Date();
    let since;
    if(period === 'day') since = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    else if(period === 'week'){ since = new Date(now.getFullYear(), now.getMonth(), now.getDate()); since.setDate(since.getDate() - since.getDay()); }
    else if(period === 'month') since = new Date(now.getFullYear(), now.getMonth(), 1);
    else since = new Date(now.getFullYear(), 0, 1);

    const periodLabels = { day: 'يومي', week: 'أسبوعي', month: 'شهري', year: 'سنوي' };

    host().innerHTML = `
      <div class="home-wrap">
        <div class="tabs" style="margin-bottom:16px;">
          <button class="tab-btn ${period==='day'?'active':''}" onclick="replaceScreen('renderDepartmentReport', ${deptId}, 'day')">يومي</button>
          <button class="tab-btn ${period==='week'?'active':''}" onclick="replaceScreen('renderDepartmentReport', ${deptId}, 'week')">أسبوعي</button>

    try {
      const { count, error: countErr } = await sb.from('stage_logs')
        .select('*', { count: 'exact', head: true })
        .eq('department_id', deptId)
        .gte('exit_time', since.toISOString());

      const REPORT_LIMIT = 300;

        wrap.innerHTML = `<p style="text-align:center;color:var(--muted);font-size:13px;margin-top:20px;">لا يوجد إنتاج مكتمل بهذي الفترة</p>`;
        document.getElementById('printReportBtn').style.display = 'none';
        return;
      }
      document.getElementById('printReportBtn').style.display = 'block';

      const totalLabel = count > REPORT_LIMIT
        ? `إجمالي المكتمل: ${count} (يُعرض آخر ${REPORT_LIMIT} — استخدم فترة أقصر لرؤية التفاصيل كاملة)`
        : `إجمالي المكتمل: ${count}`;

      wrap.innerHTML = `
        <p style="text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:10px;">${totalLabel}</p>
        <div style="overflow-x:auto;border-radius:12px;box-shadow:0 4px 14px rgba(28,42,56,0.08);">

                <th style="padding:10px 8px;text-align:right;">مسؤول المشروع</th>
                <th style="padding:10px 8px;text-align:center;">الموعد النهائي</th>
                <th style="padding:10px 8px;text-align:center;">تاريخ الخروج</th>
              </tr>

            <tbody>
              ${currentReportData.map((r,i) => `

    const password = document.getElementById('editAcctPassword').value;
    const msgEl = document.getElementById('editAcctMsg');
    function showAcctMsg2(t, type){ msgEl.textContent = t; msgEl.className = 'msg show ' + type; }

    if(!name){ showAcctMsg2('اسم مسؤول القسم مطلوب', 'error'); return; }
    if(!email){ showAcctMsg2('البريد الإلكتروني مطلوب', 'error'); return; }
    if(password && password.length < 6){ showAcctMsg2('كلمة المرور 6 أحرف على الأقل', 'error'); return; }

    const btn = document.getElementById('saveAcctBtn');
    setLoading(btn, true, '💾 حفظ التعديلات');

    try {
      const { data: { session } } = await sb.auth.getSession();
      const body = { user_id: userId, email, full_name: name };
      if(password) body.password = password;

      const res = await fetch(SUPABASE_URL + '/functions/v1/update-department-account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
        body: JSON.stringify(body)
      });
      const result = await res.json();

      if(!res.ok || result.error){
        showAcctMsg2('تعذّر حفظ التعديلات: ' + (result.error || ''), 'error');
        return;
      }
      showAcctMsg2('تم تحديث الحساب بنجاح ✓', 'success');
    } catch(e){
      showAcctMsg2('تعذّر الاتصال بالخادم، حاول مجدداً', 'error');
    } finally {
      setLoading(btn, false, '💾 حفظ التعديلات');
    }
  }

  async function createDeptAccount(){
    const deptId = Number(document.getElementById('acctDept').value);
    const name = document.getElementById('acctName').value.trim();
    const email = document.getElementById('acctEmail').value.trim();
    const password = document.getElementById('acctPassword').value;
    const msgEl = document.getElementById('acctMsg');
    function showAcctMsg(t, type){ msgEl.textContent = t; msgEl.className = 'msg show ' + type; }

    if(!name || !email || !password){ showAcctMsg('عبّي كل الحقول', 'error'); return; }
    if(password.length < 6){ showAcctMsg('كلمة المرور 6 أحرف على الأقل', 'error'); return; }

    const btn = document.getElementById('acctBtn');
    setLoading(btn, true, 'إنشاء الحساب');

    const { data: { session } } = await sb.auth.getSession();

    try {
      const res = await fetch(SUPABASE_URL + '/functions/v1/create-department-account', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.access_token
        },
        body: JSON.stringify({ email, password, full_name: name, department_id: deptId })
      });
      const result = await res.json();

      setLoading(btn, false, 'إنشاء الحساب');

      if(!res.ok || result.error){
        showAcctMsg(result.error === 'missing_fields' ? 'عبّي كل الحقول' : 'تعذّر إنشاء الحساب: ' + (result.error || ''), 'error');
        return;
      }

      showAcctMsg('تم إنشاء حساب القسم بنجاح ✓', 'success');
      await renderManageAccounts();
    } catch(e){
      setLoading(btn, false, 'إنشاء الحساب');
      showAcctMsg('تعذّر الاتصال بالخادم، حاول مجدداً', 'error');
    }
  }

  let adminSearchDebounce = null;
  const ADMIN_PAGE_SIZE = 60;

  async function loadAllProductsForAdmin(query){
    const wrap = document.getElementById('adminProductsList');
    if(wrap) wrap.innerHTML = `<p style="text-align:center;color:var(--muted);font-size:13px;margin-top:20px;">جارِ التحميل...</p>`;

    try {
      let req = sb.from('products').select('*').order('created_at', { ascending: false }).limit(ADMIN_PAGE_SIZE);
      const q = (query || '').trim();
      if(q){
        // بحث حقيقي من قاعدة البيانات (وليس فقط ضمن العناصر المحمّلة) — يبقى دقيقاً بغض النظر عن حجم البيانات المتراكم يومياً
        req = req.or(`barcode.ilike.%${q}%,customer_name.ilike.%${q}%,product_name.ilike.%${q}%,product_number.ilike.%${q}%`);
      }
      const { data, error } = await req;
      if(error){ allProductsCache = []; if(wrap) wrap.innerHTML = `<p style="text-align:center;color:var(--danger);font-size:13px;margin-top:20px;">تعذّر تحميل المنتجات، تحقق من اتصالك</p>`; return; }
      allProductsCache = data || [];
      renderAdminProductsList(q);
    } catch(e){
      allProductsCache = [];
      if(wrap) wrap.innerHTML = `<p style="text-align:center;color:var(--danger);font-size:13px;margin-top:20px;">حدث خطأ غير متوقع، حاول مجدداً</p>`;
    }
  }

  async function performLog(kind, barcode, msgEl){
    if(logInProgress) return; // يمنع تسجيل مزدوج لو انضغط الزر مرتين بسرعة أو انقرأ الباركود عدة مرات متتالية
    logInProgress = true;
    function showStationMsg(t, type){ if(msgEl){ msgEl.textContent = t; msgEl.className = 'msg show ' + type; } }

    try {
      showStationMsg('جارِ التحقق من الباركود...', '');
      const productRow = await findProductByBarcode(barcode);

      if(!productRow){
        showStationMsg('لم يتم العثور على منتج بهذا الباركود', 'error');
        return;
      }

      const deptId = currentProfile.department_id;

      if(kind === 'entry'){
        const { error } = await sb.from('stage_logs').upsert({
          product_id: productRow.id,
          department_id: deptId,
          entry_time: new Date().toISOString(),
          entry_by: currentProfile.id
        }, { onConflict: 'product_id,department_id' });
        if(error){ showStationMsg('تعذّر تسجيل الدخول، تحقق من اتصالك وحاول مجدداً', 'error'); return; }
        showStationMsg('تم تسجيل دخول المنتج لقسمك ✓', 'success');
      } else {
        const { data: existing } = await sb.from('stage_logs').select('*').eq('product_id', productRow.id).eq('department_id', deptId).maybeSingle();
        if(!existing || !existing.entry_time){
          showStationMsg('لازم تسجّل دخول المنتج أولاً قبل الخروج', 'error');
          return;
        }
        if(existing.exit_time){
          showStationMsg('تم تسجيل خروج هذا المنتج مسبقاً', 'error');
          return;
        }

        // قسم التركيب تحديداً يحتاج صورة قبل إتمام الخروج
        if(myDeptName() === 'التركيب'){
          go('renderInstallationPhotoCapture', productRow);
          return;
        }

        const { error } = await sb.from('stage_logs').update({
          exit_time: new Date().toISOString(),
          exit_by: currentProfile.id
        }).eq('product_id', productRow.id).eq('department_id', deptId);
        if(error){ showStationMsg('تعذّر تسجيل الخروج، تحقق من اتصالك وحاول مجدداً', 'error'); return; }
        showStationMsg('تم تسجيل خروج المنتج من قسمك ✓', 'success');
      }
      const bc = document.getElementById('stationBarcode');
      if(bc) bc.value = '';
    } catch(e){
      showStationMsg('حدث خطأ غير متوقع، تحقق من اتصال الإنترنت وحاول مجدداً', 'error');
    } finally {
      logInProgress = false;
    }
  }

  function compressImage(file, maxDim, quality){
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = function(){
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob((blob) => {
          resolve(blob || file); // لو فشل الضغط لأي سبب، نرجع الملف الأصلي بدل ما نوقف العملية
        }, 'image/jpeg', quality);
      };
      img.onerror = function(){ resolve(file); };
      img.src = url;
    });
  }

  // ============ الكاميرا وقراءة الباركود ============
  let cameraStream = null;
  let cameraRAF = null;

  async function scanAndLog(kind){
    const overlay = document.getElementById('cameraOverlay');
    const video = document.getElementById('cameraVideo');
    document.getElementById('cameraTitle').textContent = kind === 'entry' ? 'وجّه الكاميرا نحو الباركود لتسجيل الدخول' : 'وجّه الكاميرا نحو الباركود لتسجيل الخروج';

    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    } catch(e){
      // ما فيه صلاحية كاميرا أو الجهاز ما يدعمها - انتقل مباشرة للإدخال اليدوي
      openManualEntry();
      const msgEl = document.getElementById('stationMsg');
      if(msgEl){ msgEl.textContent = 'تعذّر تشغيل الكاميرا (تحقق من صلاحية الوصول)، استخدم الإدخال اليدوي'; msgEl.className = 'msg show error'; }
      return;
    }

    video.srcObject = cameraStream;
    overlay.classList.add('active');

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function tick(){
      if(!cameraStream) return; // تم الإغلاق
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
        if(code && code.data){
          const detected = code.data;
          closeCamera();
          performLog(kind, detected, document.getElementById('stationMsg'));
          return;
        }
      }
      cameraRAF = requestAnimationFrame(tick);
    }
    cameraRAF = requestAnimationFrame(tick);
  }

  function closeCamera(){
    const overlay = document.getElementById('cameraOverlay');
    overlay.classList.remove('active');
    if(cameraRAF){ cancelAnimationFrame(cameraRAF); cameraRAF = null; }
    if(cameraStream){
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
  }

  // دالة كاميرا عامة قابلة لإعادة الاستخدام: تفتح الكاميرا، وعند قراءة باركود تستدعي onDetected(code) وتغلق الكاميرا تلقائياً
  async function scanBarcodeGeneric(title, onDetected, onFail){
    const overlay = document.getElementById('cameraOverlay');
    const video = document.getElementById('cameraVideo');
    document.getElementById('cameraTitle').textContent = title;

    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    } catch(e){
      if(onFail) onFail();
      return;
    }

    video.srcObject = cameraStream;
    overlay.classList.add('active');

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function tick(){
      if(!cameraStream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
        if(code && code.data){
          closeCamera();
          onDetected(code.data);
          return;
        }
      }
      cameraRAF = requestAnimationFrame(tick);
    }
    cameraRAF = requestAnimationFrame(tick);
  }

  async function lookupProductForEdit(){
    const q = document.getElementById('editLookupBarcode').value.trim();
    const msgEl = document.getElementById('editLookupMsg');
    const resultsEl = document.getElementById('editLookupResults');
    function showLookupMsg(t, type){ msgEl.textContent = t; msgEl.className = 'msg show ' + type; }

    if(!q){ showLookupMsg('اكتب أي جزء من بيانات المنتج أولاً', 'error'); return; }
    resultsEl.innerHTML = '';
    showLookupMsg('جارِ البحث...', '');

    try {
      const { data, error } = await sb.from('products').select('*')
        .or(`barcode.ilike.%${q}%,product_number.ilike.%${q}%,product_name.ilike.%${q}%,customer_name.ilike.%${q}%`)
        .order('created_at', { ascending: false })
        .limit(20);
      if(error) throw error;

      if(!data || data.length === 0){
        showLookupMsg('لم يتم العثور على أي منتج مطابق', 'error');
        return;

      if(data.length === 1){
        msgEl.className = 'msg';
        go('renderEditProductForm', data[0]);
        return;
      }

      msgEl.className = 'msg';
      editLookupResultsCache = data;
      resultsEl.innerHTML = `
        <div class="section-label">${data.length} نتيجة — اختر المنتج</div>
        ${data.map((p, i) => `
          <div class="action-card" onclick="openEditResultByIndex(${i})">
            <div class="action-text">
              <h3>${escapeAttr(p.product_name) || escapeAttr(p.customer_name) || '—'}</h3>
              <p>${escapeAttr(p.product_number) || escapeAttr(p.barcode)} · ${escapeAttr(p.customer_name) || '—'}</p>
            </div>
          </div>
        `).join('')}
      `;
    } catch(e){
      showLookupMsg('حدث خطأ، تحقق من اتصالك وحاول مجدداً', 'error');
    }
  }

  let editLookupResultsCache = [];
  function openEditResultByIndex(i){
    const p = editLookupResultsCache[i];
    if(p) go('renderEditProductForm', p);
  }

  async function scanForEdit(){
    const overlay = document.getElementById('cameraOverlay');
    const video = document.getElementById('cameraVideo');
    document.getElementById('cameraTitle').textContent = 'وجّه الكاميرا نحو باركود المنتج المطلوب تعديله';
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    } catch(e){
      const msgEl = document.getElementById('editLookupMsg');
      if(msgEl){ msgEl.textContent = 'تعذّر تشغيل الكاميرا، استخدم البحث اليدوي'; msgEl.className = 'msg show error'; }
      return;
    }
    video.srcObject = cameraStream;
    overlay.classList.add('active');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    function tick(){
      if(!cameraStream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
        if(code && code.data){
          closeCamera();
          document.getElementById('editLookupBarcode').value = code.data;
          lookupProductForEdit();
          return;
        }
      }
      cameraRAF = requestAnimationFrame(tick);
    }
    cameraRAF = requestAnimationFrame(tick);
  }

  function escapeAttr(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderEditProductForm(product){
    setTopbar('تعديل بيانات منتج');
    host().innerHTML = `
      <div class="form-screen">
        <div id="printArea">
          <div id="qrCanvasEdit"></div>
          <div class="barcode-text" style="display:block;text-align:center;margin-top:8px;">${product.barcode}</div>
          <div style="font-size:13px;color:var(--text);line-height:2;margin-top:6px;text-align:center;">
            <div>العميل: <b>${escapeAttr(product.customer_name)}</b></div>
            <div>المنتج: <b>${escapeAttr(product.product_name)}</b></div>
            <div>رقم المنتج: <b>${escapeAttr(product.product_number) || '—'}</b></div>
          </div>
        </div>
        <button class="btn-outline" style="width:100%;margin:10px 0 6px;" onclick="window.print()">🖨️ إعادة طباعة الباركود</button>
        <div class="msg" id="editProductMsg"></div>

        <div class="section-label">بيانات المنتج</div>
        <div class="field">
          <label>اسم العميل</label>
          <input type="text" id="ePCustomer" value="${escapeAttr(product.customer_name)}">
        </div>
        <div class="field">
          <label>اسم المنتج</label>
          <input type="text" id="ePProductName" value="${escapeAttr(product.product_name)}">
        </div>
        <div class="field">
          <label>رقم المنتج (اودو)</label>
          <input type="text" id="ePOdooNumber" value="${escapeAttr(product.odoo_number)}">
        </div>
        <div class="row-2">
          <div class="field">
            <label>تكلفة المنتج</label>
            <input type="number" id="ePCost" value="${product.cost_price ?? ''}" min="0">
          </div>
          <div class="field">
            <label>سعر المنتج</label>
            <input type="number" id="ePSell" value="${product.sale_price ?? ''}" min="0">
          </div>
        </div>
        <div class="field">
          <label>عنوان التسليم</label>
          <input type="text" id="ePDeliveryAddress" value="${escapeAttr(product.delivery_address)}">
        </div>
        <div class="field">
          <label>مسؤول المشروع</label>
          <input type="text" id="ePManager" value="${escapeAttr(product.project_manager)}">
        </div>
        <div class="field">
          <label>الموعد النهائي للمشروع</label>
          <input type="date" id="ePDeadline" value="${product.project_deadline || ''}">
        </div>
        <div class="field" style="display:flex;align-items:center;gap:10px;flex-direction:row-reverse;justify-content:flex-end;">
          <label style="margin:0;">مبيعات خارجية (المنتج يُصنَّع خارج الشركة)</label>
          <input type="checkbox" id="ePIsExternal" ${product.is_external ? 'checked' : ''} onchange="toggleEditExternalSupplierField()" style="width:20px;height:20px;">
        </div>
        <div class="field" id="ePSupplierWrap" style="display:${product.is_external ? 'block' : 'none'};">
          <label>اسم المورد الخارجي</label>
          <input type="text" id="ePSupplier" value="${escapeAttr(product.supplier_name)}">
        </div>

        <button class="btn-primary" id="saveEditBtn" style="margin-top:14px;" onclick="submitEditProduct('${product.id}')">💾 حفظ التعديلات</button>
        <button class="btn-outline" style="width:100%;margin-top:10px;" onclick="go('openEditProductLookup')">بحث عن منتج آخر</button>
      </div>
    `;
    var qrE = qrcode(0, 'M');
    qrE.addData(product.barcode);
    qrE.make();
    document.getElementById('qrCanvasEdit').innerHTML = qrE.createSvgTag({ cellSize: 4, margin: 6 });
  }

  function toggleEditExternalSupplierField(){
    const checked = document.getElementById('ePIsExternal').checked;
    document.getElementById('ePSupplierWrap').style.display = checked ? 'block' : 'none';
  }

  async function submitEditProduct(productId){
    const customer = document.getElementById('ePCustomer').value.trim();
    const productName = document.getElementById('ePProductName').value.trim();
    const odooNumber = document.getElementById('ePOdooNumber').value.trim();
    const cost = document.getElementById('ePCost').value;
    const sell = document.getElementById('ePSell').value;
    const deliveryAddress = document.getElementById('ePDeliveryAddress').value.trim();
    const manager = document.getElementById('ePManager').value.trim();
    const deadline = document.getElementById('ePDeadline').value;
    const isExternal = document.getElementById('ePIsExternal').checked;
    const supplier = document.getElementById('ePSupplier').value.trim();
    const msgEl = document.getElementById('editProductMsg');
    function showMsg2(t, type){ msgEl.textContent = t; msgEl.className = 'msg show ' + type; }

    if(!customer || !productName){ showMsg2('الرجاء تعبئة اسم العميل واسم المنتج على الأقل', 'error'); return; }

    const btn = document.getElementById('saveEditBtn');
    setLoading(btn, true, '💾 حفظ التعديلات');
    try {
      const { error } = await sb.from('products').update({
        customer_name: customer,
        product_name: productName,
        odoo_number: odooNumber || null,
        cost_price: cost ? Number(cost) : null,
        sale_price: sell ? Number(sell) : null,
        delivery_address: deliveryAddress || null,
        project_manager: manager || null,
        project_deadline: deadline || null,
        is_external: isExternal,
        supplier_name: isExternal ? (supplier || null) : null
      }).eq('id', productId);
      if(error){ showMsg2('تعذّر حفظ التعديلات، حاول مجدداً', 'error'); return; }
      showMsg2('تم حفظ التعديلات بنجاح ✓', 'success');
    } catch(e){
      showMsg2('حدث خطأ غير متوقع، تحقق من اتصالك', 'error');
    } finally {
      setLoading(btn, false, '💾 حفظ التعديلات');
    }
  }

  function generateBarcode(){
    const rand = Math.random().toString(36).slice(2, 7).toUpperCase();
    const time = Date.now().toString(36).toUpperCase();
    return 'PST-' + time + rand;
  }

  async function submitProduct(){
    const customer = document.getElementById('pCustomer').value.trim();
    const productName = document.getElementById('pProductName').value.trim();
    const odooNumber = document.getElementById('pOdooNumber').value.trim();
    const cost = document.getElementById('pCost').value;
    const sell = document.getElementById('pSell').value;
    const deliveryAddress = document.getElementById('pDeliveryAddress').value.trim();
    const manager = document.getElementById('pManager').value.trim();
    const deadline = document.getElementById('pDeadline').value;
    const isExternal = document.getElementById('pIsExternal').checked;
    const supplier = document.getElementById('pSupplier').value.trim();
    const msgEl = document.getElementById('productMsg');

    function showProductMsg(t, type){ msgEl.textContent = t; msgEl.className = 'msg show ' + type; }

    if(!customer || !productName){
      showProductMsg('الرجاء تعبئة اسم العميل واسم المنتج على الأقل', 'error');
      return;
    }

    const btn = document.getElementById('saveProductBtn');
    setLoading(btn, true, 'حفظ وتوليد الباركود');

    try {
      // توليد رقم المنتج تلقائياً بقاعدة البيانات (آمن حتى مع عدة عمليات إدخال بنفس اللحظة)
      const { data: genNumber, error: numErr } = await sb.rpc('generate_product_number');
      if(numErr) throw numErr;

      const barcode = generateBarcode();

      const { data: product, error: pErr } = await sb.from('products').insert({
        barcode: barcode,
        product_name: productName,
        product_number: genNumber,
        odoo_number: odooNumber || null,
        customer_name: customer,
        entry_date: new Date().toISOString().slice(0,10),
        cost_price: cost ? Number(cost) : null,
        sale_price: sell ? Number(sell) : null,
        delivery_address: deliveryAddress || null,
        project_manager: manager || null,
        project_deadline: deadline || null,
        is_external: isExternal,
        supplier_name: isExternal ? (supplier || null) : null,
        created_by: currentProfile.id
      }).select().single();

      if(pErr) throw pErr;

      // دخول المنتج لقسم المبيعات نفسه يُسجَّل تلقائياً فور إنشائه (بدون حاجة لمسح باركود)
      await sb.from('stage_logs').upsert({
        product_id: product.id,
        department_id: currentProfile.department_id,
        entry_time: new Date().toISOString(),
        entry_by: currentProfile.id
      }, { onConflict: 'product_id,department_id' });

      setLoading(btn, false, 'حفظ وتوليد الباركود');
      go('renderProductSuccess', product);
    } catch(e){
      setLoading(btn, false, 'حفظ وتوليد الباركود');
      showProductMsg('تعذّر حفظ المنتج، حاول مجدداً', 'error');
    }
  }

  function renderProductSuccess(product){
    setTopbar('تم الحفظ');
    host().innerHTML = `
      <div class="success-wrap">
        <div class="success-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2 style="margin:0 0 4px;color:var(--primary);">تم إنشاء المنتج</h2>
        <p style="color:var(--muted);font-size:13.5px;margin:0 0 4px;">هذا هو باركود المنتج — اطبعه أو التقط له صورة والصقه على المنتج</p>
        <div id="printArea">
          <div id="qrCanvas"></div>
          <div class="barcode-text" style="display:block;margin-top:10px;">${product.barcode}</div>
          <div style="font-size:13px;color:var(--text);line-height:2;margin-top:6px;">
            <div>العميل: <b>${product.customer_name || '—'}</b></div>
            <div>المنتج: <b>${product.product_name || '—'}</b></div>
            <div>رقم المنتج: <b>${product.product_number || '—'}</b></div>
          </div>
        </div>
        <div class="security-note">هذا الباركود يحتوي فقط رمز تعريف المنتج، وليس فيه الأسعار — الأسعار تبقى محمية ولا تظهر إلا للمدير وقسم المبيعات داخل النظام، حتى لو صوّر أي شخص آخر الباركود.</div>
        <button class="btn-primary" style="margin-top:12px;" onclick="window.print()">🖨️ طباعة الباركود</button>
        <button class="btn-primary" style="margin-top:10px;background:var(--primary);" onclick="go('openAddProductForm')">إضافة منتج آخر</button>
        <button class="btn-outline" style="width:100%;margin-top:10px;" onclick="goHome('renderDeptStation')">الذهاب لتسجيل دخول/خروج المنتج</button>
      </div>
    `;
    var qr = qrcode(0, 'M');
    qr.addData(product.barcode);
    qr.make();
    document.getElementById('qrCanvas').innerHTML = qr.createSvgTag({ cellSize: 5, margin: 8 });
  }

  // لو فيه جلسة محفوظة مسبقاً: نظهر شاشة البصمة (لو مفعّلة لنفس هذا الحساب) أو ندخل مباشرة
  (async () => {
    try {
      const { data: { session } } = await sb.auth.getSession();
      if(session){
        const saved = getSavedBiometric();
        if(saved && saved.uid === session.user.id){
          showBiometricPanel();
        } else {
          await loadProfileAndEnter();
        }
      }
    } catch(e){
      // فشل التحقق من الجلسة (مثلاً لا يوجد إنترنت عند فتح الصفحة) - يبقى المستخدم بشاشة تسجيل الدخول بدل ما يتجمّد النظام
      console.error('session check failed', e);
    }
  })();

  // شبكة أمان عامة: أي خطأ برمجي غير متوقع بأي مكان بالنظام يُسجَّل بدل ما يوقف التطبيق بصمت أو يجمّد الشاشة
  window.addEventListener('error', function(e){ console.error('Unhandled error:', e.error || e.message); });

  // تحديث دوري لعدّاد الإشعارات (كل 30 ثانية، فقط لو المدير مسجّل دخول) - يبقيه محدّثاً بدون تحميل ثقيل
  setInterval(function(){
    if(currentProfile && currentProfile.role === 'admin') refreshNotifBadge();
  }, 30000);
  window.addEventListener('unhandledrejection', function(e){ console.error('Unhandled promise rejection:', e.reason); });
</script>
